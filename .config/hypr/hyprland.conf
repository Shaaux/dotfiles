# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

# Gaming window rules (added by omarchy-setup-gaming)
# Enable tearing for Proton/native games (reduced input latency)
windowrule = immediate on, match:class ^steam_app_
windowrule = immediate on, match:class ^gamescope$

# Full opacity for games (override Omarchy's default 0.97/0.9)
windowrule = tag -default-opacity, match:class ^steam_app_
windowrule = opacity 1 1, match:class ^steam_app_
windowrule = no_blur on, match:class ^steam_app_
windowrule = no_shadow on, match:class ^steam_app_
windowrule = idle_inhibit always, match:class ^steam_app_

# Same for gamescope windows
windowrule = tag -default-opacity, match:class ^gamescope$
windowrule = opacity 1 1, match:class ^gamescope$
windowrule = no_blur on, match:class ^gamescope$
windowrule = no_shadow on, match:class ^gamescope$
windowrule = idle_inhibit always, match:class ^gamescope$

# Prevent Steam notifications from stealing focus
windowrule = no_focus on, match:title ^notificationtoasts_
windowrule = no_initial_focus on, match:title ^notificationtoasts_

# Silence fcitx5 Wayland diagnose warning (gaming-mode installer)
env = FCITX_NO_WAYLAND_DIAGNOSE,1
